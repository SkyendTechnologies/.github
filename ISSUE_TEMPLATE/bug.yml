name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include secrets or report security vulnerabilities here.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you can.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, commit, OS, runtime, deployment mode, or other relevant details.
      placeholder: |
        Version/commit:
        OS:
        Runtime:
        Other:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Remove tokens, credentials, personal data, and other secrets.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for existing reports of this issue.
          required: true
        - label: This is not a security vulnerability.
          required: true
