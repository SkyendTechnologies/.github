name: Build organization banner

on:
  push:
    branches:
      - main
    paths:
      - "profile/assets/logo.png"
      - "tools/build_banner.py"
      - ".github/workflows/build-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build banner
        run: python tools/build_banner.py

      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/banner.png
          if git diff --cached --quiet; then
            echo "Banner is already up to date."
            exit 0
          fi
          git commit -m "design: rebuild organization banner"
          git push
