name: Fix organization banner corners

on:
  push:
    branches: [main]
    paths:
      - "tools/build_banner.py"
      - ".github/workflows/build-banner.yml"

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/build_banner.py
      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/banner.png
          if git diff --cached --quiet; then
            echo "Banner is already up to date."
            exit 0
          fi
          git commit -m "design: fix banner corner transparency"
          git push
